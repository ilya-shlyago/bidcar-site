  h1{font-size:26px;font-weight:800;margin:26px 0 4px}

  input:focus,select:focus{border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chk{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px;color:var(--ink)}
  .chk input{width:auto}
  .btn{width:100%;margin-top:20px;background:linear-gradient(180deg,var(--gold2),var(--gold));
    color:#25190a;font-weight:800;padding:15px;border:none;border-radius:12px;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-sec{background:transparent;color:var(--ink);border:1px solid var(--gold)}
  .hidden{display:none}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.09);font-size:15px}
  .row span:last-child{font-weight:700}
  .row.total{border:none;font-size:19px;padding-top:14px}
  .row.total span:last-child{color:var(--gold)}
  .rtitle{font-weight:800;font-size:17px;margin-bottom:4px}
  .rcar{color:var(--mut);font-size:14px;margin-bottom:14px}
  .mkt{margin:12px 0;padding:12px 14px;background:rgba(233,185,73,.07);border:1px solid rgba(233,185,73,.22);border-radius:10px}
  .mkt .l{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--mut)}
  .mkt .l b{color:var(--ink)}
  .profit{font-size:19px;font-weight:800;text-align:center;padding:12px;border-radius:10px;margin-top:12px}
  .err{color:#ff9a9a;font-size:14px;margin-top:12px}
  .spin{color:var(--mut);font-size:14px;margin-top:12px}
  footer{color:var(--mut);font-size:12px;text-align:center;padding:26px 0;border-top:1px solid var(--line);margin-top:20px}
  .nav-right{display:flex;align-items:center;gap:12px;position:relative}

  .iconbtn svg{width:18px;height:18px}
  .dot{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:#48d18a;border:2px solid var(--navy)}
  .menu{position:absolute;top:46px;right:0;min-width:220px;background:#0e2246;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.55);z-index:30}
  .menu .mi{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;font-size:14px;border-radius:8px;color:var(--ink)}

  .menu a.mi{cursor:pointer}
  .menu a.mi:hover{background:rgba(255,255,255,.05)}
  .menu .sep{height:1px;background:var(--line);margin:6px 2px}

<div class="wrap">

  <div class="card" id="gate" style="text-align:center">

  <div id="app" class="hidden">

    <div class="grid2">

          <option value="hybrid" data-i="f_hybrid">Гибрид</option>
          <option value="plugin" data-i="f_plugin">Plug-in</option>
        </select>
      </div>
    </div>

    <!-- US→PL -->
    <div id="f_uspl">
      <div class="grid2">
        <div><label data-i="l_region">Регион США</label>
          <select id="region"><option value="east" data-i="rg_east">Восток</option><option value="south" data-i="rg_south">Юг</option><option value="west" data-i="rg_west">Запад</option></select></div>
        <div><label data-i="l_city">Город (Польша)</label><select id="city_pl" class="city_pl"></select></div>
      </div>
    </div>
    <!-- US→BY -->
    <div id="f_usby" class="hidden">
      <label data-i="l_route">Маршрут доставки</label>
      <select id="route"><option value="klaipeda">Клайпеда</option><option value="poti">Поти</option><option value="turkey" data-i="rt_turkey">Турция</option></select>
      <div class="chk"><input type="checkbox" id="benefit"><label style="margin:0" data-i="l_benefit">Льгота на пошлину (−50%)</label></div>
    </div>
    <!-- DE→PL -->
    <div id="f_depl" class="hidden">
      <div class="grid2">
        <div><label data-i="l_yard">Ярд (Германия)</label><select id="yard"></select></div>
        <div><label data-i="l_city">Город (Польша)</label><select id="city_pl2" class="city_pl"></select></div>
      </div>
      <div class="chk"><input type="checkbox" id="vat"><label style="margin:0" data-i="l_vat">Цена с НДС (MwSt)</label></div>
      <label data-i="l_deliv">Доставка</label>
      <select id="deliv"><option value="trailer" data-i="dv_trailer">Автовозом</option><option value="self" data-i="dv_self">Своим ходом</option></select>
    </div>

    <button class="btn" id="calc" data-i="btn_calc">Рассчитать</button>
    <div class="err hidden" id="err"></div>
  </div>

  <!-- RESULT -->
  <div class="card hidden" id="result"></div>

    </div>

    <div id="bizresult"></div>
  </div>

Object.assign(T.uk,{gate_title:"Вхід",gate_sub:"Увійдіть, щоб користуватися калькулятором.",or:"або",logout:"Вийти",m_login:"Увійти",m_status:"Статус",m_free:"Free",m_left:"Залишилось",q_left:"Залишилось {n} з {m}",q_prem:"⭐ Premium — безліміт",paywall:"Ліміт {m} безкоштовних розрахунків вичерпано. Оформи Premium у боті.",openbot:"Відкрити бота",relogin:"Сесія завершилась — увійди знову.",autherr:"Не вдалося увійти. Спробуй ще раз."});
function t(k){return (T[LANG][k]!=null?T[LANG][k]:T.ru[k])||k}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.getAttribute('data-i');if(T[LANG][k]!=null)el.innerHTML=T[LANG][k];});
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.getElementById('lbl_price').setAttribute('data-i', dir()==='de-pl'?'l_price_eur':'l_price_usd');
  document.getElementById('lbl_price').innerHTML = dir()==='de-pl'?t('l_price_eur'):t('l_price_usd');
}
document.getElementById('langs').onclick=e=>{if(e.target.dataset.l){LANG=e.target.dataset.l;applyLang();}};

function dir(){return document.getElementById('dir').value}
function fill(sel,arr,val,lab){sel.innerHTML='';arr.forEach(o=>{const op=document.createElement('option');op.value=val(o);op.textContent=lab(o);sel.appendChild(op);});}
// заполнить статические селекты
document.querySelectorAll('.city_pl').forEach(s=>fill(s,CITIES,x=>x,x=>x));
fill(document.getElementById('yard'),YARDS,x=>x,x=>x);

function switchDir(){
  const d=dir();
  document.getElementById('f_uspl').classList.toggle('hidden',d!=='us-pl');
  document.getElementById('f_usby').classList.toggle('hidden',d!=='us-by');
  document.getElementById('f_depl').classList.toggle('hidden',d!=='de-pl');
  applyLang();
  document.getElementById('result').classList.add('hidden');
  document.getElementById('biz').classList.add('hidden');
}
document.getElementById('dir').onchange=switchDir;

function money(n){return Math.round(n).toLocaleString('ru-RU')+' €';}
function rowHTML(label,val){return `<div class="row"><span>${label}</span><span>${money(val)}</span></div>`;}

document.getElementById('calc').onclick=async()=>{
  const d=dir(), err=document.getElementById('err'), res=document.getElementById('result');
  err.classList.add('hidden'); res.classList.remove('hidden'); res.innerHTML=`<div class="spin">${t('calc')}</div>`;
  const base={year:+val('year'),engine_cc:+val('engine'),fuel:val('fuel')};
  let url,body;
  if(d==='us-pl'){url='/calc/us-pl';body={...base,price_usd:+val('price'),region:val('region'),goal:'resell'};}
  else if(d==='us-by'){url='/calc/us-by';body={...base,price_usd:+val('price'),route:val('route'),benefit:document.getElementById('benefit').checked};}
  else{url='/calc/de';body={...base,price:+val('price'),city:document.getElementById('city_pl2').value,yard:val('yard'),goal:'self',has_vat:document.getElementById('vat').checked,delivery_type:val('deliv')};}
  try{
    const r=await authFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===402){const e=await r.json();res.classList.add('hidden');
      err.innerHTML=t('paywall').replace('{m}',e.detail.limit)+' <a href="https://t.me/'+TG_BOT+'" target="_blank">'+t('openbot')+' →</a>';
      err.classList.remove('hidden');refreshQuota();return;}
    if(!r.ok) throw new Error();
    renderResult(d,await r.json()); refreshQuota();
  }catch(e){if(e&&e.handled)return;res.classList.add('hidden');err.textContent=t('err');err.classList.remove('hidden');}
};
function val(id){return document.getElementById(id).value;}

function renderResult(d,j){
  lastTotal=j.total; lastDest=j.destination;
  let rows='';
  if(d==='us-by'){
    rows+=rowHTML(t('r_price'),j.price_eur)+rowHTML(t('r_fees'),j.fees_eur)
      +rowHTML(t('r_delivery')+' · '+j.delivery.label,j.delivery.total)
      +rowHTML(t('r_customs'),j.customs.total);
  }else if(d==='us-pl'){
    const u=j.usa;
    rows+=rowHTML(t('r_price'),u.price_eur)+rowHTML(t('r_fees'),u.fees_eur)
      +rowHTML(t('r_delivery'),u.inland_eur+u.ocean_eur+u.eu_delivery)
      +rowHTML(t('r_customs'),u.customs_total)+rowHTML(t('r_reg'),j.registration+j.adaptation);
  }else{
    rows+=rowHTML(t('r_price'),j.price+ (j.car_vat||0))+rowHTML(t('r_fees'),j.fees.total)
      +rowHTML(t('r_delivery'),j.delivery_cost)+rowHTML(t('r_customs'),j.customs.total)
      +rowHTML(t('r_reg'),j.registration);
  }
  const oc=j.oc_annual?`<div class="row"><span>${t('r_oc')}</span><span>${money(j.oc_annual)}</span></div>`:'';
  document.getElementById('result').innerHTML=rows+`<div class="row total"><span>${t('r_total')}</span><span>${money(j.total)}</span></div>`+oc;
  setupBiz(d);
}

// ── Бизнес ──
async function setupBiz(d){
  const biz=document.getElementById('biz'); biz.classList.remove('hidden');
  document.getElementById('bizresult').innerHTML=''; document.getElementById('berr').classList.add('hidden');
  const makeSel=document.getElementById('make'), modelSel=document.getElementById('model');
  const bodyWrap=document.getElementById('body_wrap');
  if(lastDest==='by'){
    bodyWrap.style.display='none';
    const r=await fetch(API+'/catalog/by/makes?popular=true');const j=await r.json();
    fill(makeSel,j.makes,m=>m.id,m=>m.name);
    loadByModels();
    makeSel.onchange=loadByModels;
  }else{
    bodyWrap.style.display='';
    const r=await fetch(API+'/catalog/pl/makes');const j=await r.json();
    fill(makeSel,j.makes,m=>m,m=>m);
    const rb=await fetch(API+'/catalog/pl/bodies');const jb=await rb.json();
    fill(document.getElementById('body'),jb.bodies,b=>b.slug,b=>b.label);
    loadPlModels();
    makeSel.onchange=loadPlModels;
  }
}
async function loadByModels(){const id=document.getElementById('make').value;const r=await fetch(API+'/catalog/by/models?make_id='+id);const j=await r.json();fill(document.getElementById('model'),j.models,m=>m.id,m=>m.name);}
async function loadPlModels(){const mk=document.getElementById('make').value;const r=await fetch(API+'/catalog/pl/models?make='+encodeURIComponent(mk));const j=await r.json();fill(document.getElementById('model'),j.models,m=>m.slug,m=>m.label);}

document.getElementById('calcbiz').onclick=async()=>{
  const berr=document.getElementById('berr'),out=document.getElementById('bizresult');
  berr.classList.add('hidden'); out.innerHTML=`<div class="spin">${t('calc')}</div>`;
  const year=+val('year'),repair=+val('repair')||0;
  let url,body;
  if(lastDest==='by'){url='/resale/by';body={make_id:+val('make'),model_id:+val('model'),year,total:lastTotal,repair};}
  else{url='/resale/pl';body={make_slug:val('make'),model_slug:val('model'),year,body_slug:val('body'),mileage:0,total:lastTotal,repair};}
  try{
    const r=await authFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(typeof e.detail==='string'?e.detail:'');}
    renderBiz(await r.json(),year);
  }catch(e){if(e&&e.handled)return;out.innerHTML='';berr.textContent=(e.message||t('err'));berr.classList.remove('hidden');}
};
function renderBiz(j,year){
  const yp=j.year_price, mp=j.model_price;
  let mkt='<div class="mkt">';
  if(yp) mkt+=`<div class="l"><span>${t('byear').replace('{y}',year)} · ${t('bcnt').replace('{n}',yp.count)}</span><b>${money(yp.median_eur)}</b></div>`;
  if(mp) mkt+=`<div class="l"><span>${t('bmodel').replace('{a}',mp.y0).replace('{b}',mp.y1)} · ${t('bcnt').replace('{n}',mp.count)}</span><b>${money(mp.median_eur)}</b></div>`;
  mkt+='</div>';
  const pos=j.profit>=0, col=pos?'#48d18a':'#ff8a8a', bg=pos?'rgba(72,209,138,.12)':'rgba(255,138,138,.12)';
  document.getElementById('bizresult').innerHTML=
    `<div class="row"><span>${t('bsale')}</span><span>${money(j.sale_eur)}</span></div>`
    +`<div class="row"><span>${t('binvest')}</span><span>${money(j.invest)}</span></div>`
    +mkt
    +`<div class="profit" style="color:${col};background:${bg}">${t('bprofit')}: ${pos?'+':''}${money(j.profit)} (${pos?'+':''}${j.margin}%)</div>`
    +`<div style="text-align:center;margin-top:10px"><a href="${j.url}" target="_blank">${j.market==='onliner'?'Onliner':'Otomoto'} →</a></div>`;
}
// ── Авторизация через Telegram ──
let TOKEN=localStorage.getItem('bidcar_token')||null;
const TG_BOT="bid_calculation_bot";

function renderWidget(){
  const box=document.getElementById('tg-btn'); box.innerHTML='';
  const s=document.createElement('script');
  s.async=true; s.src="https://telegram.org/js/telegram-widget.js?22";
  s.setAttribute('data-telegram-login',TG_BOT);
  s.setAttribute('data-size','large');
  s.setAttribute('data-onauth','onTelegramAuth(user)');
  s.setAttribute('data-request-access','write');
  box.appendChild(s);
}
window.onTelegramAuth=async(user)=>{
  await doAuth('/auth/telegram', user);
};
// ── Google Sign-In ──
const GOOGLE_CLIENT_ID="PASTE_YOUR_GOOGLE_CLIENT_ID";   // <-- вставь свой Client ID из Google Cloud
window.onGoogleAuth=async(resp)=>{ await doAuth('/auth/google', {credential:resp.credential}); };
function initGoogle(){
  const box=document.getElementById('g-btn'), or=document.getElementById('or');
  if(!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID.startsWith('PASTE')||!(window.google&&google.accounts&&google.accounts.id)){
    if(!(window.google&&google.accounts)) setTimeout(initGoogle,400);   // GIS ещё грузится
    return;
  }
  or.classList.remove('hidden'); box.innerHTML='';
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:onGoogleAuth});
  google.accounts.id.renderButton(box,{theme:'filled_black',size:'large',shape:'pill',width:240});
}
async function doAuth(url, payload){
  const gerr=document.getElementById('gerr'); gerr.classList.add('hidden');
  try{
    const r=await fetch(API+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error();
    const j=await r.json();
    TOKEN=j.token; localStorage.setItem('bidcar_token',TOKEN);
    if(j.name) localStorage.setItem('bidcar_name',j.name);
    showApp(j);
  }catch(e){gerr.textContent=t('autherr'); gerr.classList.remove('hidden');}
}
let ME=null;
function quotaText(m){return m.premium?t('q_prem'):t('q_left').replace('{n}',Math.max(0,m.limit-m.used)).replace('{m}',m.limit);}
function renderMenu(){
  const menu=document.getElementById('menu');
  if(TOKEN&&ME){
    menu.innerHTML=
      `<div class="mi"><b>👤 ${ME.name||''}</b></div>`
      +`<div class="mi muted"><span>${t('m_status')}</span><span>${ME.premium?t('q_prem'):t('m_free')}</span></div>`
      +(ME.premium?'':`<div class="mi muted"><span>${t('m_left')}</span><span>${Math.max(0,ME.limit-ME.used)} / ${ME.limit}</span></div>`)
      +`<div class="sep"></div>`
      +`<a class="mi" id="mlogout">${t('logout')}</a>`;
    document.getElementById('mlogout').onclick=(e)=>{e.preventDefault();doLogout();};
  }else{
    menu.innerHTML=`<a class="mi login" id="mlogin">${t('m_login')}</a>`;
    document.getElementById('mlogin').onclick=(e)=>{e.preventDefault();closeMenu();showGate();window.scrollTo({top:0,behavior:'smooth'});};
  }
}
function closeMenu(){document.getElementById('menu').classList.add('hidden');}
function showApp(m){
  ME=m;
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('pdot').classList.remove('hidden');
  renderMenu();
}
function showGate(){
  ME=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('pdot').classList.add('hidden');
  renderMenu(); renderWidget(); initGoogle();
}
function doLogout(){TOKEN=null;localStorage.removeItem('bidcar_token');localStorage.removeItem('bidcar_name');document.getElementById('gerr').classList.add('hidden');closeMenu();showGate();}
async function refreshQuota(){
  try{const r=await fetch(API+'/me',{headers:{Authorization:'Bearer '+TOKEN}});
    if(r.ok){ME=Object.assign(ME||{},await r.json());renderMenu();}}catch(e){}
}
// профиль: открыть/закрыть меню
document.getElementById('profile').onclick=(e)=>{e.stopPropagation();const m=document.getElementById('menu');const was=m.classList.contains('hidden');renderMenu();m.classList.toggle('hidden',!was);};
document.addEventListener('click',(e)=>{const m=document.getElementById('menu');if(!m.classList.contains('hidden')&&!e.target.closest('#menu')&&!e.target.closest('#profile'))closeMenu();});
async function authFetch(url,opts){
  opts=opts||{}; opts.headers=Object.assign({},opts.headers,{Authorization:'Bearer '+TOKEN});
  const r=await fetch(API+url,opts);
  if(r.status===401){TOKEN=null;localStorage.removeItem('bidcar_token');showGate();
    document.getElementById('gerr').textContent=t('relogin');document.getElementById('gerr').classList.remove('hidden');
    throw {handled:true};}
  return r;
}
async function initAuth(){
  if(!TOKEN){showGate();return;}
  try{const r=await fetch(API+'/me',{headers:{Authorization:'Bearer '+TOKEN}});
    if(!r.ok) throw new Error();
    const j=await r.json(); j.name=localStorage.getItem('bidcar_name'); showApp(j);
  }catch(e){TOKEN=null;localStorage.removeItem('bidcar_token');showGate();}
}

switchDir(); applyLang(); initAuth();
</script>
